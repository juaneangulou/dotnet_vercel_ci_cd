name: .NET CI and Vercel CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: Build, test and container smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore CleanApi.sln
      - name: Build
        run: dotnet build CleanApi.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test CleanApi.sln --configuration Release --no-build --logger trx --results-directory TestResults
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore
      - name: Build deployment image
        run: docker build --file Dockerfile.vercel --tag clean-api:ci .
      - name: Verify container startup and endpoints
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name clean-api-ci \
            --publish 127.0.0.1:8080:8080 \
            --env App__Name="CI API" \
            --env App__SupportEmail="ci@example.com" \
            --env Swagger__Enabled=true \
            clean-api:ci
          trap 'docker logs clean-api-ci; docker rm --force clean-api-ci' EXIT
          curl --fail --retry 15 --retry-all-errors --retry-delay 2 \
            --connect-timeout 2 --max-time 5 --retry-max-time 60 \
            http://127.0.0.1:8080/health
          curl --fail http://localhost:8080/api/info
          curl --fail http://localhost:8080/openapi/v1.json
          curl --fail http://localhost:8080/swagger/index.html
          curl --fail --header 'Content-Type: application/json' \
            --data '{"quantity":3}' \
            http://localhost:8080/api/products/11111111-1111-1111-1111-111111111111/quotes

  deploy:
    name: Deploy production
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ steps.vercel.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in VERCEL_ORG_ID VERCEL_PROJECT_ID VERCEL_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required secret: $name"
              exit 1
            fi
          done
      - name: Install pinned CLI
        run: npm ci
      - name: Deploy container on Vercel
        id: vercel
        shell: bash
        run: |
          set -euo pipefail
          url="$(npx --no-install vercel deploy --prod --yes --token "$VERCEL_TOKEN")"
          if [[ ! "$url" =~ ^https://[^[:space:]]+$ ]]; then
            echo "::error::Vercel did not return a valid deployment URL."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Production deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
